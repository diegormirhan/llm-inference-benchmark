[project]
name = "llm-inference-benchmark"
version = "0.1.0"
description = "Benchmark de inferência LLM com múltiplos engines"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "black>=24.8",
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["test.*"]
disallow_untyped_defs = false

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "N",
    "UP",
    "B",
    "A",
    "COM",
    "C4",
    "PT",
    "RET",
    "SIM",
    "TCH",
    "RUF",
]
ignore = ["COM812"]

[tool.ruff.lint.isort]
known-first-party = ["engines", "load_tester", "telemetry", "dashboard"]

[tool.pytest.ini_options]
testpaths = ["test"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["engines", "load_tester", "telemetry"]
omit = ["test/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
